<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jennie Presents Ruby</title>
  <!-- Google Fonts để tái tạo phông chữ nghệ thuật -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Playfair+Display:ital,wght@1,400;1,600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #e50019; /* Tông màu đỏ đặc trưng */
      color: #000;
      font-family: 'Bodoni Moda', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .poster {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 20px 10px;
    }

    /* --- HEADER STYLES --- */
    .header {
      margin-bottom: 25px;
    }

    .header-title {
      font-size: 2.2rem;
      line-height: 1.1;
    }

    .script-text {
      font-family: 'Alex Brush', cursive;
      font-size: 3.5rem;
      font-weight: normal;
      display: inline-block;
      vertical-align: middle;
    }

    .presents {
      font-size: 0.85rem;
      letter-spacing: 2px;
      font-weight: 700;
      margin: 0 5px;
      vertical-align: middle;
    }

    .subtitle {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.6rem;
      margin-top: 5px;
    }

    /* --- TICKET STYLES --- */
    .tickets-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Kiểu vé vé xén góc (Ticket notch shape) */
    .ticket {
      position: relative;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      align-items: center;
      border: 1.5px solid #000;
      padding: 12px 5px;
      background: transparent;
      
      /* Tạo vết xén 4 góc như vé */
      clip-path: polygon(
        0 12px, 12px 12px, 12px 0,
        calc(100% - 12px) 0, calc(100% - 12px) 12px, 100% 12px,
        100% calc(100% - 12px), calc(100% - 12px) calc(100% - 12px), calc(100% - 12px) 100%,
        12px 100%, 12px calc(100% - 12px), 0 calc(100% - 12px)
      );
    }

    .ticket::before {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      right: 3px;
      bottom: 3px;
      border: 1px solid currentColor;
      pointer-events: none;
    }

    /* Phân cách giữa các phần trong vé */
    .ticket-col {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      padding: 5px;
    }

    .ticket-col:not(:last-child) {
      border-right: 1.5px solid currentColor;
    }

    /* Thiết kế vé viền trắng ở giữa */
    .ticket.white-theme {
      color: #fff;
      border-color: #fff;
    }

    /* --- TICKET CONTENT TYPOGRAPHY --- */
    .time-text {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 0.85rem;
      line-height: 1.3;
    }

    .time-text strong {
      font-family: 'Bodoni Moda', serif;
      font-style: normal;
      font-size: 1.05rem;
      font-weight: 900;
      display: block;
      letter-spacing: 0.5px;
    }

    .center-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.3rem;
      line-height: 1.1;
    }

    .center-title .jennie-brand {
      font-family: 'Alex Brush', cursive;
      font-style: normal;
      font-size: 2.2rem;
      margin-left: 3px;
    }

    .center-subtitle {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.15rem;
      margin-top: 2px;
    }

    .ruby-brand {
      font-family: 'Alex Brush', cursive;
      font-size: 3.2rem;
      font-weight: normal;
      line-height: 0.8;
    }

    /* --- FOOTER --- */
    .footer {
      margin-top: 35px;
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .footer-logo {
      font-weight: 900;
      font-size: 1rem;
      letter-spacing: -1px;
    }
  </style>
</head>
<body>

  <div class="poster">
    <!-- Header Section -->
    <header class="header">
      <div class="header-title">
        <span class="script-text">Jennie</span>
        <span class="presents">PRESENTS</span>
        <span class="script-text">Ruby</span>
      </div>
      <div class="subtitle">The 1st Studio Album</div>
    </header>

    <!-- Tickets Container -->
    <main class="tickets-container">
      
      <!-- Ticket 1 -->
      <div class="ticket">
        <div class="ticket-col">
          <div class="time-text">
            Thursday<br>
            <strong>MAR 6</strong>
            12PM EST
          </div>
        </div>
        <div class="ticket-col">
          <div class="center-title">
            like <span class="jennie-brand">Jennie</span>
          </div>
          <div class="center-subtitle">Music Video Teaser</div>
        </div>
        <div class="ticket-col">
          <div class="time-text">
            Friday<br>
            <strong>MAR 7</strong>
            2AM KST
          </div>
        </div>
      </div>

      <!-- Ticket 2 (White Theme) -->
      <div class="ticket white-theme">
        <div class="ticket-col">
          <div class="time-text">
            <strong>MAR 7</strong>
            12AM
          </div>
        </div>
        <div class="ticket-col" style="flex-direction: row; gap: 10px; align-items: baseline;">
          <span class="ruby-brand">Ruby</span>
          <span class="center-subtitle" style="text-align: left; line-height: 1;">Album<br>Release</span>
        </div>
        <div class="ticket-col">
          <div class="time-text">
            <strong>LOCAL</strong>
            TIME
          </div>
        </div>
      </div>

      <!-- Ticket 3 -->
      <div class="ticket">
        <div class="ticket-col">
          <div class="time-text">
            Friday<br>
            <strong>MAR 7</strong>
            12AM EST
          </div>
        </div>
        <div class="ticket-col">
          <div class="center-title">
            like <span class="jennie-brand">Jennie</span>
          </div>
          <div class="center-subtitle">Music Video Premiere</div>
        </div>
        <div class="ticket-col">
          <div class="time-text">
            Friday<br>
            <strong>MAR 7</strong>
            2PM KST
          </div>
        </div>
      </div>

    </main>

    <!-- Footer Section -->
    <footer class="footer">
      <span class="footer-logo">OA</span>
      <span>jenni.e</span>
      <span class="footer-logo">👁</span>
    </footer>
  </div>

</body>
</html>
