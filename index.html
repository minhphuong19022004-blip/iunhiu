<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRADUATION PARTY - DREW STYLE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,700;0,900;1,700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Tông màu pastel ngọt ngào ấm áp đặc trưng của Drew House */
            background-color: #fce895;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Khung thiệp bo tròn mềm mại */
        .card {
            background-color: #ffffff;
            border: 4px solid #111111;
            border-radius: 35px;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 12px 12px 0px #111111;
            position: relative;
            overflow: hidden;
        }

        /* Biểu tượng Smiley Drew House */
        .smiley-logo {
            width: 80px;
            height: 80px;
            background-color: #fce895;
            border: 3px solid #111;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Mắt smiley */
        .smiley-eyes {
            display: flex;
            gap: 16px;
            margin-bottom: 4px;
        }

        .eye {
            width: 8px;
            height: 14px;
            background-color: #111;
            border-radius: 4px;
        }

        /* Nụ cười thay bằng chữ "drew" hoặc "JB" */
        .smiley-text {
            font-weight: 900;
            font-size: 0.85rem;
            letter-spacing: -0.5px;
            color: #111;
        }

        /* Tagline */
        .tagline {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff4d6d;
            margin-bottom: 5px;
        }

        /* Title mang phong cách Album Justice / Purpose */
        h1 {
            font-size: 2.3rem;
            font-weight: 900;
            line-height: 1.1;
            text-transform: uppercase;
            color: #111;
            margin-bottom: 10px;
        }

        h1 span {
            display: block;
            font-style: italic;
            color: #70e000;
            -webkit-text-stroke: 1.5px #111;
        }

        /* Tên chủ nhân bữa tiệc */
        .name {
            font-size: 1.5rem;
            font-weight: 900;
            background-color: #111;
            color: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            margin: 15px 0;
            transform: rotate(-2deg);
        }

        .quote {
            font-size: 0.85rem;
            font-weight: 700;
            color: #555;
            margin-bottom: 20px;
            font-style: italic;
        }

        /* Chi tiết thời gian, địa điểm */
        .details {
            background-color: #f7f7f7;
            border: 2px solid #111;
            border-radius: 20px;
            padding: 15px;
            text-align: left;
            margin-bottom: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .details p {
            margin: 6px 0;
            display: flex;
            justify-content: space-between;
        }

        .details p span {
            color: #777;
        }

        /* Nút RSVP */
        .rsvp-btn {
            width: 100%;
            background-color: #ff4d6d;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-weight: 900;
            font-size: 1rem;
            padding: 14px;
            border: 3px solid #111;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #111;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .rsvp-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #111;
            background-color: #ff758f;
        }

        .rsvp-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #111;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Logo Smiley biểu tượng của nhà Drew -->
        <div class="smiley-logo">
            <div class="smiley-eyes">
                <div class="eye"></div>
                <div class="eye"></div>
            </div>
            <div class="smiley-text">drew</div>
        </div>

        <div class="tagline">Anyone / Peaches / Purpose</div>
        
        <h1>GRADUATION <span>CELEBRATION</span></h1>

        <!-- Thay tên của bạn vào đây -->
        <div class="name">BIEBER & [TÊN BẠN]</div>

        <p class="quote">"I got my degree, yeah, load it up!" 🎓✨</p>

        <!-- Chi tiết sự kiện -->
        <div class="details">
            <p><span>WHEN:</span> <strong>Sat, Aug 21, 2026</strong></p>
            <p><span>TIME:</span> <strong>05:00 PM - Till Late</strong></p>
            <p><span>WHERE:</span> <strong>Justice Lounge, Hanoi</strong></p>
            <p><span>DRESS CODE:</span> <strong>Oversized / Y2K Vibe</strong></p>
        </div>

        <!-- Nút tương tác -->
        <button class="rsvp-btn" onclick="alert('Baby, baby, baby, oh! Cảm ơn bạn đã xác nhận tham dự! ❤️')">
            LET'S CELEBRATE / RSVP
        </button>
    </div>

</body>
</html>
