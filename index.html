<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graduation Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Poppins',sans-serif;
background:linear-gradient(180deg,#fffdf9,#f5efe6);
text-align:center;
color:#5c4b51;
}

.card{
max-width:420px;
margin:40px auto;
background:white;
padding:35px;
border-radius:25px;
box-shadow:0 15px 40px rgba(0,0,0,.1);
}

img{
width:220px;
border-radius:50%;
border:6px solid #e8d9c5;
margin:20px 0;
}

h1{
font-size:34px;
margin:0;
}

h2{
color:#b38b59;
}

.info{
margin-top:20px;
font-size:18px;
line-height:1.8;
}

button{
margin-top:25px;
padding:14px 35px;
border:none;
background:#b38b59;
color:white;
font-size:18px;
border-radius:30px;
cursor:pointer;
}

button:hover{
background:#9d7649;
}

.footer{
margin-top:30px;
font-size:15px;
color:#888;
}
</style>

</head>

<body>

<div class="card">

<h2>🎓 Graduation Invitation 🎓</h2>

<h1>Đinh Minh Phương</h1>

<img src="https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=700" alt="Graduation">

<p><i>"Every ending is a new beginning."</i></p>

<div class="info">

📅 <b>08:00 - Thứ Bảy</b><br>

Ngày ... tháng ... năm 2026

<br><br>

📍 Trường Đại học .............

<br><br>

💐 Rất hân hạnh được đón tiếp bạn đến tham dự buổi lễ tốt nghiệp của mình.

</div>

<button onclick="window.open('https://maps.google.com')">
📍 Xem địa điểm
</button>

<div class="footer">

Cảm ơn vì đã đồng hành cùng mình ❤️

</div>

</div>

</body>
</html>
